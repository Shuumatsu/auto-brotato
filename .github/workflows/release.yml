name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.2.2). Must match manifest.json."
        required: true
      tag:
        description: "Tag name (default: v<version>)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG="${INPUT_TAG:-v$VERSION}"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

      - name: Build single release bundle
        run: bash build_release.sh

      - name: Verify bundle (one zip = mod + preview + description + docs)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob, json, os, zipfile

          expected = os.environ["VERSION"]
          bundles = sorted(glob.glob("dist/AutoBattler-v*.zip"))
          assert bundles, "build_release.sh produced no bundle"
          path = bundles[-1]
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              manifest = json.loads(
                  z.read("mods-unpacked/Pasha-AutoBattler/manifest.json"))
              assert manifest["version_number"] == expected, \
                  f"manifest {manifest['version_number']} != release {expected}"
              for required in [
                  "preview.png",
                  "description.txt",
                  "README.md",
                  "INSTALL.txt",
                  "LICENSE-BOTato-MIT.txt",
              ]:
                  assert required in names, f"missing {required}"
              for suffix in [
                  "/player_movement_behavior.gd",
                  "/steering/arbiter.gd",
                  "/steering/world_view.gd",
              ]:
                  assert any(n.endswith(suffix) for n in names), f"missing {suffix}"
              print(f"OK {path}: version={expected}, files={len(names)}")
          PY

      - name: Generate release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "dist/AutoBattler-v${VERSION}.zip" | awk '{print $1}')"
          cat > RELEASE_NOTES.md <<EOF
          **AutoBattler ${VERSION}** — Brotato movement autopilot. One file, everything included.

          **This single zip contains**
          - \`mods-unpacked/\` — the ModLoader mod (local install + Workshop content)
          - \`preview.png\` — Workshop preview image
          - \`description.txt\` — Workshop description (BBCode)
          - \`README.md\`, \`README-FORK.md\`, \`INSTALL.txt\`, MIT license

          **Local install (Steam)**
          Put the zip into any subscribed Workshop item folder \\
          (\`steamapps/workshop/content/1942280/<item>/\`), then start Brotato through Steam.

          **Steam Workshop update**
          1. Download this zip.
          2. Run \`GodotWorkshopUtility\` from the Brotato folder, select this zip,
             Workshop ID \`3834096920\`.
          3. When the tool asks for a preview image, extract \`preview.png\` from the zip and select it.
          4. After upload, paste \`description.txt\` (also inside the zip) into the Workshop description.

          SHA256: \`${SHA}\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AutoBattler ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/AutoBattler-v*.zip
          draft: false
