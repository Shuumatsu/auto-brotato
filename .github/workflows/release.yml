name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.2.2). Must match manifest.json."
        required: true
      tag:
        description: "Tag name (default: v<version>)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG="${INPUT_TAG:-v$VERSION}"
          else
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

      - name: Build
        run: bash build.sh

      - name: Verify manifest version
        run: |
          python3 - <<'PY'
          import glob, json, zipfile, os

          expected = os.environ["VERSION"]
          zips = sorted(glob.glob("dist/AutoBattler-*-fork.zip"))
          assert zips, "no zip produced"
          with zipfile.ZipFile(zips[-1]) as z:
              manifest = json.loads(
                  z.read("mods-unpacked/Pasha-AutoBattler/manifest.json"))
          actual = manifest["version_number"]
          assert actual == expected, f"manifest version {actual} != release {expected}"
          print(f"OK version={actual}")
          PY
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Stage Workshop-friendly zip and checksums
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cp "dist/AutoBattler-${VERSION}-fork.zip" \
             "workshop/AutoBattler - Movement Autopilot v${VERSION}.zip"
          (cd dist && shasum -a 256 *.zip) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la "workshop/AutoBattler - Movement Autopilot v${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AutoBattler ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          body: |
            AutoBattler ${{ steps.ver.outputs.version }} — Brotato movement autopilot (decisions stay manual).

            **Install locally / on another machine**
            1. Download `AutoBattler-${{ steps.ver.outputs.version }}-fork.zip`.
            2. Place it in a subscribed Workshop item folder:
               `steamapps/workshop/content/1942280/<item>/` (or use `install.sh --item <id>`).

            **Update the Steam Workshop item**
            1. Download `AutoBattler - Movement Autopilot v${{ steps.ver.outputs.version }}.zip`.
            2. On a machine with Steam running/logged in (Windows recommended for this project),
               open `GodotWorkshopUtility.exe` from the Brotato install folder.
            3. Select the zip, set Workshop ID `3834096920`, click Upload, then paste
               `description.txt` into the Workshop description.

            GitHub-hosted CI cannot upload to Steam Workshop: Workshop uploads use the
            Steamworks client UGC API and require a logged-in Steam client.
          files: |
            dist/*.zip
            workshop/AutoBattler - Movement Autopilot v*.zip
            workshop/preview.png
            workshop/description.txt
            SHA256SUMS.txt
          draft: false
